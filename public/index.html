er;flex-shrink:0\">\n    <div style=\"width:16px;height:2px;background:#1E3A5F;position:relative\">\n      <div style=\"position:absolute;top:-5px;left:0;width:16px;height:2px;background:#1E3A5F\"><\u002Fdiv>\n      <div style=\"position:absolute;top:5px;left:0;width:16px;height:2px;background:#1E3A5F\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:14.5px;font-weight:600;color:#122238\">GenFarmer · Giáo trình 1 tuần<\u002Fdiv>\n  <div style=\"margin-left:auto;display:flex;align-items:center;gap:10px\">\n    <div style=\"width:80px;height:6px;border-radius:6px;background:rgba(30,58,95,0.12);overflow:hidden\">\n      <div style=\"{{ progressBarFillStyle }}\"><\u002Fdiv>\n    <\u002Fdiv>\n    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#2563EB;font-weight:600\">{{ progressPercent }}%<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"{{ overlayStyle }}\" sc-camel-on-click=\"{{ closeNav }}\"><\u002Fdiv>\n\n<div style=\"{{ sidebarStyle }}\">\n  <div style=\"padding:28px 24px 18px\">\n    <div style=\"font-size:11px;letter-spacing:.08em;color:#5B7A9E;font-family:'IBM Plex Mono',monospace;margin-bottom:5px\">GENFARMER<\u002Fdiv>\n    <div style=\"font-size:18px;font-weight:700;color:#0F2545;line-height:1.3\">Giáo trình 1 tuần<\u002Fdiv>\n    <div style=\"font-size:12.5px;color:#5B7A9E;margin-top:2px\">Nhập môn BoxPhone<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin:0 20px 22px;padding:16px 18px;border-radius:16px;background:rgba(255,255,255,0.55);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.7);box-shadow:0 6px 20px rgba(31,71,140,0.08)\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px\">\n      <span style=\"font-size:12px;color:#5B7A9E\">Tiến độ hoàn thành<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#2563EB;font-weight:700\">{{ doneCount }}/{{ totalSteps }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"width:100%;height:7px;border-radius:7px;background:rgba(30,58,95,0.1);overflow:hidden\">\n      <div style=\"{{ progressBarFillStyle }}\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <nav style=\"padding:0 14px 18px;display:flex;flex-direction:column;gap:2px\">\n    <a href=\"#hero\" style=\"{{ navLinkStyle }}\">Mở đầu<\u002Fa>\n    <a href=\"#layers\" style=\"{{ navLinkStyle }}\">A1 · Bốn lớp hệ thống<\u002Fa>\n    <a href=\"#roadmap\" style=\"{{ navLinkStyle }}\">A2 · Lộ trình 1 tuần<\u002Fa>\n    <a href=\"#day0\" style=\"{{ navLinkStyle }}\">A3 · Ngày 0 — Chuẩn bị<\u002Fa>\n    <a href=\"#day1\" style=\"{{ navLinkStyle }}\">A4 · Ngày 1 — Phần cứng<\u002Fa>\n    <a href=\"#day2\" style=\"{{ navLinkStyle }}\">A5 · Ngày 2 — Danh tính<\u002Fa>\n    <a href=\"#day3\" style=\"{{ navLinkStyle }}\">A6 · Ngày 3 — Tự động<\u002Fa>\n    <a href=\"#day45\" style=\"{{ navLinkStyle }}\">A7 · Ngày 4–5 — Nền tảng<\u002Fa>\n    <a href=\"#symptoms\" style=\"{{ navLinkStyle }}\">Tra cứu theo triệu chứng<\u002Fa>\n    <a href=\"#gaps\" style=\"{{ navLinkStyle }}\">Chỗ cần bổ sung<\u002Fa>\n  <\u002Fnav>\n\n  <div style=\"padding:16px 24px;border-top:1px solid rgba(30,58,95,0.1);font-size:11px;color:#8098B5\">Phần A · bản 1.0 · 09/2026<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"position:relative;z-index:1;padding-top:64px\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:56px 32px 100px\">\n\n    <div id=\"hero\" style=\"margin-bottom:52px;scroll-margin-top:84px\">\n      <p style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#5B7A9E;letter-spacing:.05em;margin:0 0 16px\">PHẦN A · TRANG A1–A7 · ĐỌC TRƯỚC KHI MỞ HDSD 141 TRANG<\u002Fp>\n      <h1 style=\"font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin:0 0 16px;color:#0F2545\">Giáo trình 1 tuần — Nhập môn BoxPhone GenFarmer<\u002Fh1>\n      <p style=\"font-size:16px;line-height:1.6;color:#3D5772;max-width:62ch;margin:0 0 20px\">Năm ngày để làm chủ hệ thống, không phải năm ngày để ra kết quả. <b style=\"color:#0F2545;font-weight:600\">Ra kết quả cần 2–4 tuần nuôi tài khoản.<\u002Fb> Hai mốc này khác nhau, và biết trước sẽ đỡ hụt hẫng.<\u002Fp>\n      <div style=\"border-left:3px solid #2563EB;background:rgba(37,99,235,0.06);padding:14px 18px;border-radius:0 14px 14px 0;max-width:62ch;backdrop-filter:blur(6px)\">\n        <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#3D5772\">Tài liệu này đi kèm HDSD GenFarmer 141 trang. Phần A dạy trình tự và lý do. HDSD là thư viện tra cứu chi tiết. Khi cần thao tác cụ thể, phần A sẽ chỉ đúng số trang cần mở.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"layers\" style=\"margin-bottom:56px;scroll-margin-top:84px\">\n      <div style=\"{{ sectionHeadStyle }}\">\n        <span style=\"font-size:21px;font-weight:700;color:#0F2545\">Hệ thống này gồm bốn lớp<\u002Fspan>\n        <span style=\"{{ sectionMetaStyle }}\">A1<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"{{ sectionNoteStyle }}\">Đọc trang này trước tiên. Khi có sự cố, việc đầu tiên cần làm không phải là sửa, mà là xác định hỏng ở lớp nào. Biết được lớp là đã giải quyết xong một nửa.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px\">\n        <div style=\"{{ glassCardStyle }}\">\n          <div style=\"position:relative;width:100%;padding-bottom:100%;border-radius:14px;overflow:hidden;margin-bottom:14px\">\n            <image-slot id=\"layer-boxphone\" shape=\"rect\" style=\"position:absolute;inset:0\" placeholder=\"Ảnh Boxphone\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#2563EB;margin-bottom:6px;font-weight:600\">LỚP 1<\u002Fdiv>\n          <div style=\"font-size:17px;font-weight:700;color:#0F2545;margin-bottom:8px\">Boxphone<\u002Fdiv>\n          <p style=\"font-size:13.5px;color:#4B6584;line-height:1.5;margin:0\">Đây là phần cứng bạn đã mua từ GenFarmer<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"{{ glassCardStyle }}\">\n          <div style=\"position:relative;width:100%;padding-bottom:100%;border-radius:14px;overflow:hidden;margin-bottom:14px\">\n            <image-slot id=\"layer-router\" shape=\"rect\" style=\"position:absolute;inset:0\" placeholder=\"Ảnh Router\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#0891B2;margin-bottom:6px;font-weight:600\">LỚP 2<\u002Fdiv>\n          <div style=\"font-size:17px;font-weight:700;color:#0F2545;margin-bottom:8px\">Router<\u002Fdiv>\n          <p style=\"font-size:13.5px;color:#4B6584;line-height:1.5;margin:0\">GenRouter cấp cho mỗi máy một đường ra internet riêng, không dùng chung.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"{{ glassCardStyle }}\">\n          <div style=\"position:relative;width:100%;padding-bottom:100%;border-radius:14px;overflow:hidden;margin-bottom:14px\">\n            <image-slot id=\"layer-account\" shape=\"rect\" style=\"position:absolute;inset:0\" placeholder=\"Ảnh Account + Proxy\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7C3AED;margin-bottom:6px;font-weight:600\">LỚP 3<\u002Fdiv>\n          <div style=\"font-size:17px;font-weight:700;color:#0F2545;margin-bottom:8px\">Account + Proxy<\u002Fdiv>\n          <p style=\"font-size:13.5px;color:#4B6584;line-height:1.5;margin:0\">Đây là thứ bạn cần chuẩn bị để khởi chạy dàn farm của mình<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"{{ glassCardStyle }}\">\n          <div style=\"position:relative;width:100%;padding-bottom:100%;border-radius:14px;overflow:hidden;margin-bottom:14px\">\n            <image-slot id=\"layer-automation\" shape=\"rect\" style=\"position:absolute;inset:0\" placeholder=\"Ảnh Automation\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#059669;margin-bottom:6px;font-weight:600\">LỚP 4<\u002Fdiv>\n          <div style=\"font-size:17px;font-weight:700;color:#0F2545;margin-bottom:8px\">Automation<\u002Fdiv>\n          <p style=\"font-size:13.5px;color:#4B6584;line-height:1.5;margin:0\">Đây là các kịch bản tự động hoá đăng nhập, nuôi tài khoản, đẩy tương tác GenFarmer đã làm sẵn trong các gói package, nếu bạn chưa mua nó để tự động hoá công việc của bạn, hãy liên hệ sales GenFarmer để được hỗ trợ nhé. Nếu không muốn tự động bạn có thể làm thủ công.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:14px;color:#4B6584;margin:18px 0 0;max-width:70ch;line-height:1.55\">Năm ngày dưới đây đi đúng thứ tự bốn lớp này: máy trước, mạng và danh tính sau, kịch bản sau cùng. Không được nhảy cóc, vì lớp sau luôn dựng trên lớp trước.<\u002Fp>\n    <\u002Fdiv>\n\n    <div id=\"roadmap\" style=\"margin-bottom:56px;scroll-margin-top:84px\">\n      <div style=\"{{ sectionHeadStyle }}\">\n        <span style=\"font-size:21px;font-weight:700;color:#0F2545\">Lộ trình một tuần<\u002Fspan>\n        <span style=\"{{ sectionMetaStyle }}\">A2<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"{{ sectionNoteStyle }}\">Mỗi ngày trả lời đúng một câu hỏi. Trả lời xong thì sang ngày tiếp theo, chưa xong thì ở lại — không có phần thưởng nào cho việc đi nhanh.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:1px;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,0.7);box-shadow:0 6px 24px rgba(31,71,140,0.08)\">\n        <div style=\"display:flex;align-items:center;gap:16px;padding:14px 20px;background:rgba(255,255,255,0.7);backdrop-filter:blur(14px);flex-wrap:wrap\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#2563EB;font-weight:600;min-width:64px\">Ngày 0<\u002Fspan>\n          <span style=\"font-size:14.5px;color:#1E3A5F;flex:1;min-width:200px\">Tôi cần chuẩn bị sẵn những gì?<\u002Fspan>\n          <span style=\"font-size:12.5px;color:#8098B5\">Không bị kẹt giữa chừng vì thiếu đồ<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:16px;padding:14px 20px;background:rgba(255,255,255,0.5);backdrop-filter:blur(14px);flex-wrap:wrap\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#2563EB;font-weight:600;min-width:64px\">Ngày 1<\u002Fspan>\n          <span style=\"font-size:14.5px;color:#1E3A5F;flex:1;min-width:200px\">Máy có nghe lời tôi không?<\u002Fspan>\n          <span style=\"font-size:12.5px;color:#8098B5\">Tôi điều khiển được 20 chiếc điện thoại<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:16px;padding:14px 20px;background:rgba(255,255,255,0.7);backdrop-filter:blur(14px);flex-wrap:wrap\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#2563EB;font-weight:600;min-width:64px\">Ngày 2<\u002Fspan>\n          <span style=\"font-size:14.5px;color:#1E3A5F;flex:1;min-width:200px\">Tài khoản của tôi có sống được không?<\u002Fspan>\n          <span style=\"font-size:12.5px;color:#8098B5\">Tài khoản không chết ngay trong ngày đầu<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:16px;padding:14px 20px;background:rgba(255,255,255,0.5);backdrop-filter:blur(14px);flex-wrap:wrap\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#2563EB;font-weight:600;min-width:64px\">Ngày 3<\u002Fspan>\n          <span style=\"font-size:14.5px;color:#1E3A5F;flex:1;min-width:200px\">Máy có tự làm thay tôi được không?<\u002Fspan>\n          <span style=\"font-size:12.5px;color:#8098B5\">Tôi đi ngủ mà hệ thống vẫn chạy<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:16px;padding:14px 20px;background:rgba(255,255,255,0.7);backdrop-filter:blur(14px);flex-wrap:wrap\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#2563EB;font-weight:600;min-width:64px\">Ngày 4–5<\u002Fspan>\n          <span style=\"font-size:14.5px;color:#1E3A5F;flex:1;min-width:200px\">Nó làm ra được gì cho tôi?<\u002Fspan>\n          <span style=\"font-size:12.5px;color:#8098B5\">Tôi tự cấu hình được, không cần hỏi ai<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"day0\" style=\"margin-bottom:56px;scroll-margin-top:84px\">\n      <div style=\"{{ sectionHeadStyle }}\">\n        <span style=\"font-size:21px;font-weight:700;color:#0F2545\">Ngày 0 — Chuẩn bị<\u002Fspan>\n        <span style=\"{{ sectionMetaStyle }}\">A3<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"{{ sectionNoteStyle }}\">Làm trước khi hàng về tới nơi. Ba ngày đầu là ba ngày hào hứng nhất; đừng để chúng trôi qua trong lúc chờ mua proxy.<\u002Fp>\n\n      <div style=\"{{ dayCardStyle }}\">\n        <div style=\"{{ dayHeadStyle }}\">\n          <span style=\"{{ dayBadgePrepStyle }}\">NGÀY 0<\u002Fspan>\n          <div>\n            <p style=\"{{ dayQStyle }}\">Tôi cần chuẩn bị sẵn những gì?<\u002Fp>\n            <p style=\"{{ daySubStyle }}\">Chưa cần cắm điện. Chỉ cần có đủ bảy thứ dưới đây trước khi bắt đầu Ngày 1.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"{{ dayBodyStyle }}\">\n          <div style=\"{{ flowRowStyle }}\">\n            <div style=\"{{ flowStepStyle }}\">\n              <div style=\"{{ flowIconStyle }}\">⌂<\u002Fdiv>\n              <span style=\"{{ flowLabelStyle }}\">Chỗ đặt box + điện riêng<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"{{ flowArrowStyle }}\">›<\u002Fdiv>\n            <div style=\"{{ flowStepStyle }}\">\n              <div style=\"{{ flowIconStyle }}\">☰<\u002Fdiv>\n              <span style=\"{{ flowLabelStyle }}\">Mạng dây + máy tính có wifi<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"{{ flowArrowStyle }}\">›<\u002Fdiv>\n            <div style=\"{{ flowStepStyle }}\">\n              <div style=\"{{ flowIconStyle }}\">◈<\u002Fdiv>\n              <span style=\"{{ flowLabelStyle }}\">Mua sẵn tài khoản + proxy thử<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"{{ flowArrowStyle }}\">›<\u002Fdiv>\n            <div style=\"{{ flowStepStyle }}\">\n              <div style=\"{{ flowIconStyle }}\">▣<\u002Fdiv>\n              <span style=\"{{ flowLabelStyle }}\">Quay video mở hộp<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"{{ h4Style }}\">CHUẨN BỊ<\u002Fdiv>\n\n          <div style=\"{{ stepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d0_0 }}\">\n            <div style=\"{{ circleStyle.d0_0 }}\"><span style=\"{{ checkStyle.d0_0 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d0_0 }}\"><b style=\"color:#0F2545;font-weight:600\">Chỗ đặt box<\u002Fb> — phòng thoáng hoặc có điều hoà, cách tường khoảng 10cm cho thoáng bốn mặt. Không đặt dưới sàn, không đặt trong tủ kín, không đặt cạnh cửa sổ nắng.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ stepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d0_1 }}\">\n            <div style=\"{{ circleStyle.d0_1 }}\"><span style=\"{{ checkStyle.d0_1 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d0_1 }}\"><b style=\"color:#0F2545;font-weight:600\">Nguồn điện riêng<\u002Fb> — không cắm chung ổ với điều hoà, lò nướng hay máy giặt. Nên có bộ lưu điện từ 1.000VA để hệ thống không tắt đột ngột khi mất điện.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ stepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d0_2 }}\">\n            <div style=\"{{ circleStyle.d0_2 }}\"><span style=\"{{ checkStyle.d0_2 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d0_2 }}\"><b style=\"color:#0F2545;font-weight:600\">Đường mạng có dây<\u002Fb> — một cổng trống trên modem cho GenRouter.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ stepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d0_3 }}\">\n            <div style=\"{{ circleStyle.d0_3 }}\"><span style=\"{{ checkStyle.d0_3 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d0_3 }}\"><b style=\"color:#0F2545;font-weight:600\">Máy tính điều khiển có wifi<\u002Fb> — kể cả khi đấu bằng dây LAN, phần mềm vẫn cần wifi trên máy tính mới nhận được thiết bị.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ stepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d0_4 }}\">\n            <div style=\"{{ circleStyle.d0_4 }}\"><span style=\"{{ checkStyle.d0_4 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d0_4 }}\"><b style=\"color:#0F2545;font-weight:600\">5 tài khoản và 5 proxy để chạy thử<\u002Fb> — mua trước, đừng đợi tới lúc cần. Chưa cần mua 20 tài khoản.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ stepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d0_5 }}\">\n            <div style=\"{{ circleStyle.d0_5 }}\"><span style=\"{{ checkStyle.d0_5 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d0_5 }}\"><b style=\"color:#0F2545;font-weight:600\">Một tài khoản Google<\u002Fb> — để lấy API key Gemini tại Google AI Studio, dùng cho phần bình luận tự động. <a href=\"https://genfarmer.com/hdsd.pdf#page=30\" target=\"_blank\" style=\"{{ refPillStyle }}\">HDSD tr. 30–39<\u002Fa>\n              <div style=\"font-size:12.5px;color:#8098B5;margin-top:5px\">Tài liệu gốc gọi nhầm mục này là \"Apple Key\". Đây là API key của Gemini, không liên quan gì tới Apple.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ stepRowLastStyle }}\" sc-camel-on-click=\"{{ toggles.d0_6 }}\">\n            <div style=\"{{ circleStyle.d0_6 }}\"><span style=\"{{ checkStyle.d0_6 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d0_6 }}\"><b style=\"color:#0F2545;font-weight:600\">Video mở hộp<\u002Fb> — quay lại lúc bóc, giữ nguyên tem. Đây là bằng chứng bảo hành nếu có lỗi từ nhà sản xuất.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"{{ gateStyle }}\">\n            <div style=\"{{ gateTitleStyle }}\">XONG KHI<\u002Fdiv>\n            <p style=\"{{ gateTextStyle }}\">Có đủ bảy mục trên. Chưa cắm điện cũng không sao.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"{{ trapsWrapStyle }}\">\n            <div style=\"{{ trapsTitleStyle }}\">BA LỖI HAY GẶP<\u002Fdiv>\n            <div style=\"{{ trapRowStyle }}\"><span style=\"{{ trapXStyle }}\">×<\u002Fspan><span style=\"{{ trapTextStyle }}\">Đặt box trong tủ kín hoặc dưới gầm bàn cho gọn — nhiệt không thoát được, máy tự giảm hiệu năng.<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ trapRowStyle }}\"><span style=\"{{ trapXStyle }}\">×<\u002Fspan><span style=\"{{ trapTextStyle }}\">Cắm chung ổ điện với thiết bị công suất lớn, hệ thống sập giữa lúc đang chạy.<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ trapRowLastStyle }}\"><span style=\"{{ trapXStyle }}\">×<\u002Fspan><span style=\"{{ trapTextStyle }}\">Nghĩ rằng dùng dây LAN thì máy tính không cần wifi. Vẫn cần.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"day1\" style=\"margin-bottom:56px;scroll-margin-top:84px\">\n      <div style=\"{{ sectionHeadStyle }}\">\n        <span style=\"font-size:21px;font-weight:700;color:#0F2545\">Ngày 1 — Làm chủ phần cứng<\u002Fspan>\n        <span style=\"{{ sectionMetaStyle }}\">A4 · lớp 1<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"{{ dayCardStyle }}\">\n        <div style=\"{{ dayHeadStyle }}\">\n          <span style=\"{{ dayBadgeStyle }}\">NGÀY 1<\u002Fspan>\n          <div>\n            <p style=\"{{ dayQStyle }}\">Ngày 1: Sử dụng cơ bản app GenFarmer Software để cảm nhận cách hoạt động của phần mềm<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n<div style=\"{{ dayBodyStyle }}\">\n          <div style=\"{{ flowRowStyle }}\">\n            <div style=\"{{ flowStepStyle }}\">\n              <div style=\"{{ flowIconStyle }}\">⇩<\u002Fdiv>\n              <span style=\"{{ flowLabelStyle }}\">Tải phần mềm<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"{{ flowArrowStyle }}\">›<\u002Fdiv>\n            <div style=\"{{ flowStepStyle }}\">\n              <div style=\"{{ flowIconStyle }}\">⛶<\u002Fdiv>\n              <span style=\"{{ flowLabelStyle }}\">Set up box + router<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"{{ flowArrowStyle }}\">›<\u002Fdiv>\n            <div style=\"{{ flowStepStyle }}\">\n              <div style=\"{{ flowIconStyle }}\">⚙<\u002Fdiv>\n              <span style=\"{{ flowLabelStyle }}\">Sử dụng software thủ công cơ bản<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"{{ h4Style }}\">CÁC BƯỚC<\u002Fdiv>\n\n          <div style=\"{{ stepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d1_0 }}\">\n            <div style=\"{{ circleStyle.d1_0 }}\"><span style=\"{{ checkStyle.d1_0 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d1_0 }}\">Tải phần mềm GenFarmer tại <span style=\"font-family:'IBM Plex Mono',monospace;color:#2563EB\">genfarmer.com/download<\u002Fspan>, cài đặt. <a href=\"https://genfarmer.com/hdsd.pdf#page=1\" target=\"_blank\" style=\"{{ refPillStyle }}\">HDSD tr. 1<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ stepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d1_1 }}\">\n            <div style=\"{{ circleStyle.d1_1 }}\"><span style=\"{{ checkStyle.d1_1 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d1_1 }}\">Đăng nhập: bấm biểu tượng ảnh đại diện, chọn Login. Chưa có tài khoản thì đăng ký trước. <a href=\"https://genfarmer.com/hdsd.pdf#page=2\" target=\"_blank\" style=\"{{ refPillStyle }}\">HDSD tr. 2–3<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ stepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d1_2 }}\">\n            <div style=\"{{ circleStyle.d1_2 }}\"><span style=\"{{ checkStyle.d1_2 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d1_2 }}\">\n              Chọn cách kết nối theo số lượng box đang dùng — đây là chỗ khách hay kẹt nhất, nên đọc kỹ:\n              <div style=\"{{ subNoteStyle }}\"><b style=\"color:#1E3A5F;font-weight:600\">1–2 box, dùng GenRouter H3000:<\u002Fb> chọn chế độ USB. Cắm là tự nhận. <a href=\"https://genfarmer.com/hdsd.pdf#page=8\" target=\"_blank\" style=\"{{ refPillStyle }}\">HDSD tr. 8<\u002Fa><\u002Fdiv>\n              <div style=\"{{ subNoteStyle }}\"><b style=\"color:#1E3A5F;font-weight:600\">2–10 box, dùng mini PC:<\u002Fb> chọn chế độ OTG. Thêm hai dải địa chỉ <span style=\"font-family:'IBM Plex Mono',monospace;color:#2563EB\">192.168.4.1–255<\u002Fspan> và <span style=\"font-family:'IBM Plex Mono',monospace;color:#2563EB\">192.168.5.1–255<\u002Fspan>, bấm Active rồi bấm Scan. <a href=\"https://genfarmer.com/hdsd.pdf#page=4\" target=\"_blank\" style=\"{{ refPillStyle }}\">HDSD tr. 4–7<\u002Fa><\u002Fdiv>\n              <div style=\"{{ subNoteStyle }}\">HDSD có ba sơ đồ đấu nối nằm liền nhau nhưng không nói bạn thuộc trường hợp nào. Cứ theo số box ở trên mà chọn.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ stepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d1_3 }}\">\n            <div style=\"{{ circleStyle.d1_3 }}\"><span style=\"{{ checkStyle.d1_3 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d1_3 }}\">Sử dụng GenFarmer Software cơ bản thủ công — mục Control Center. <a href=\"https://genfarmer.com/hdsd.pdf#page=4\" target=\"_blank\" style=\"{{ refPillStyle }}\">HDSD tr. 4–7<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ subStepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d1_3a }}\">\n            <div style=\"{{ circleStyleSub.d1_3a }}\"><span style=\"{{ checkStyleSub.d1_3a }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyleSub.d1_3a }}\">Bật wifi tự động cho cả 20 máy. <span style=\"{{ missingPillStyle }}\">◧ cần bổ sung<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ subStepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d1_3b }}\">\n            <div style=\"{{ circleStyleSub.d1_3b }}\"><span style=\"{{ checkStyleSub.d1_3b }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyleSub.d1_3b }}\">Đổi thời gian hệ thống trên máy cho khớp với múi giờ đang dùng. <span style=\"{{ missingPillStyle }}\">◧ cần bổ sung<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ subStepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d1_3c }}\">\n            <div style=\"{{ circleStyleSub.d1_3c }}\"><span style=\"{{ checkStyleSub.d1_3c }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyleSub.d1_3c }}\">Bật tắt đèn pin trên một máy bất kỳ. Đây là bài kiểm tra nhỏ nhất mà rõ ràng nhất: máy phản hồi trong vài giây nghĩa là đường điều khiển đã thông. <span style=\"{{ missingPillStyle }}\">◧ cần bổ sung<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ subStepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d1_3d }}\">\n            <div style=\"{{ circleStyleSub.d1_3d }}\"><span style=\"{{ checkStyleSub.d1_3d }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyleSub.d1_3d }}\">Thử đồng bộ thao tác: bấm trên một máy và xem cả 20 máy cùng làm theo. <span style=\"{{ missingPillStyle }}\">◧ cần bổ sung<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ subStepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d1_3e }}\">\n            <div style=\"{{ circleStyleSub.d1_3e }}\"><span style=\"{{ checkStyleSub.d1_3e }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyleSub.d1_3e }}\">Dành 15 phút bấm tay lên vài máy cho quen tay. Bước này trông như phí thời gian nhưng không phải — Ngày 3 sẽ dựa hoàn toàn vào cảm giác này.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ subStepRowLastStyle }}\" sc-camel-on-click=\"{{ toggles.d1_3f }}\">\n            <div style=\"{{ circleStyleSub.d1_3f }}\"><span style=\"{{ checkStyleSub.d1_3f }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyleSub.d1_3f }}\">Tuỳ chọn: thử vài lệnh adb nếu bạn có nền kỹ thuật. Không thử cũng không ảnh hưởng gì.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"{{ gateStyle }}\">\n            <div style=\"{{ gateTitleStyle }}\">XONG KHI<\u002Fdiv>\n            <p style=\"{{ gateTextStyle }}\">20 trên 20 máy hiện trên màn hình, tất cả đều bắt được wifi, và bấm đèn pin thì máy phản hồi.<\u002Fp>\n            <p style=\"{{ gateFailStyle }}\">Chưa đạt thì dừng ở đây, đừng sang Ngày 2. Gọi hỗ trợ với thông tin: đang dùng mấy box, chế độ USB hay OTG, bấm Scan ra bao nhiêu máy.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"{{ trapsWrapStyle }}\">\n            <div style=\"{{ trapsTitleStyle }}\">BA LỖI HAY GẶP<\u002Fdiv>\n            <div style=\"{{ trapRowStyle }}\"><span style=\"{{ trapXStyle }}\">×<\u002Fspan><span style=\"{{ trapTextStyle }}\">Bấm Scan không ra máy nào — hầu hết là do chưa thêm đủ hai dải địa chỉ, hoặc thêm rồi nhưng quên bấm Active.<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ trapRowStyle }}\"><span style=\"{{ trapXStyle }}\">×<\u002Fspan><span style=\"{{ trapTextStyle }}\">Máy tính đang tắt wifi. Phần mềm cần wifi kể cả khi đã cắm dây.<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ trapRowLastStyle }}\"><span style=\"{{ trapXStyle }}\">×<\u002Fspan><span style=\"{{ trapTextStyle }}\">Chỉ có 1–2 box mà vẫn đi đường OTG cho giống người khác, tự làm khó mình. Ít box thì dùng USB.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"day2\" style=\"margin-bottom:56px;scroll-margin-top:84px\">\n      <div style=\"{{ sectionHeadStyle }}\">\n        <span style=\"font-size:21px;font-weight:700;color:#0F2545\">Ngày 2 — Làm chủ danh tính<\u002Fspan>\n        <span style=\"{{ sectionMetaStyle }}\">A5 · lớp 2 + 3<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"{{ sectionNoteStyle }}\">Ngày quan trọng nhất tuần, và cũng là ngày HDSD nói ít nhất. Đọc kỹ trang này.<\u002Fp>\n\n      <div style=\"{{ dayCardStyle }}\">\n        <div style=\"{{ dayHeadStyle }}\">\n          <span style=\"{{ dayBadgeStyle }}\">NGÀY 2<\u002Fspan>\n          <div>\n            <p style=\"{{ dayQStyle }}\">Tài khoản của tôi có sống được không?<\u002Fp>\n            <p style=\"{{ daySubStyle }}\">Làm nhỏ trước, làm chậm trước. Hôm nay chỉ đụng tới 5 tài khoản, và phần lớn thời gian là ngồi chờ.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"{{ dayBodyStyle }}\">\n          <div style=\"{{ defineBoxStyle }}\">\n            <p style=\"margin:0 0 8px;font-size:14.5px;line-height:1.55;color:#1E3A5F\"><b style=\"font-weight:700;color:#0F2545\">Tài khoản<\u002Fb> là danh tính. <b style=\"font-weight:700;color:#0F2545\">Proxy<\u002Fb> là địa chỉ nhà của danh tính đó.<\u002Fp>\n            <p style=\"margin:0 0 8px;font-size:14.5px;line-height:1.55;color:#1E3A5F\">Nếu 20 tài khoản cùng dùng một địa chỉ, nền tảng sẽ thấy 20 người sống chung một nhà, cùng thức cùng ngủ, cùng thích một loại nội dung. Đó là lý do tài khoản chết theo cụm chứ không chết lẻ.<\u002Fp>\n            <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#1E3A5F\">GenRouter tồn tại để mỗi máy có một địa chỉ riêng. Chế độ Isolate Mode thì làm thêm một việc: nếu proxy chết, nó cắt mạng máy đó ngay lập tức thay vì để máy lộ địa chỉ thật.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"{{ flowRowStyle }}\">\n            <div style=\"{{ flowStepStyle }}\">\n              <div style=\"{{ flowIconStyle }}\">◈<\u002Fdiv>\n              <span style=\"{{ flowLabelStyle }}\">Chuẩn bị account + proxy<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"{{ flowArrowStyle }}\">›<\u002Fdiv>\n            <div style=\"{{ flowStepStyle }}\">\n              <div style=\"{{ flowIconStyle }}\">⛨<\u002Fdiv>\n              <span style=\"{{ flowLabelStyle }}\">Gán proxy + Isolate Mode<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"{{ flowArrowStyle }}\">›<\u002Fdiv>\n            <div style=\"{{ flowStepStyle }}\">\n              <div style=\"{{ flowIconStyle }}\">✎<\u002Fdiv>\n              <span style=\"{{ flowLabelStyle }}\">Đăng nhập thử bằng tay<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"{{ flowArrowStyle }}\">›<\u002Fdiv>\n            <div style=\"{{ flowStepStyle }}\">\n              <div style=\"{{ flowIconStyle }}\">▤<\u002Fdiv>\n              <span style=\"{{ flowLabelStyle }}\">Nhập bảng tài khoản<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"{{ flowArrowStyle }}\">›<\u002Fdiv>\n            <div style=\"{{ flowStepStyle }}\">\n              <div style=\"{{ flowIconStyle }}\">◷<\u002Fdiv>\n              <span style=\"{{ flowLabelStyle }}\">Chạy đơn giản để tài khoản được nuôi<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"{{ h4Style }}\">CÁC BƯỚC<\u002Fdiv>\n\n          <div style=\"{{ stepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d2_0 }}\">\n            <div style=\"{{ circleStyle.d2_0 }}\"><span style=\"{{ checkStyle.d2_0 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d2_0 }}\">Chuẩn bị 5 tài khoản và 5 proxy. Nếu muốn tiết kiệm để thử thì 5 tài khoản chia cho 2–3 proxy cũng được, nhưng nhớ rằng đó không phải cấu hình chạy thật.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ stepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d2_1 }}\">\n            <div style=\"{{ circleStyle.d2_1 }}\"><span style=\"{{ checkStyle.d2_1 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d2_1 }}\">Vào bảng điều khiển GenRouter tại <span style=\"font-family:'IBM Plex Mono',monospace;color:#2563EB\">192.168.5.1:9000<\u002Fspan>, gán proxy cho từng máy, bật Isolate Mode. <span style=\"{{ missingPillStyle }}\">◧ cần bổ sung<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ stepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d2_2 }}\">\n            <div style=\"{{ circleStyle.d2_2 }}\"><span style=\"{{ checkStyle.d2_2 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d2_2 }}\">Đăng nhập bằng tay 1–2 tài khoản. Làm chậm, quan sát từng bước.\n              <div style=\"{{ subNoteStyle }}\">Đây là bước quan trọng nhất cả tuần: tự động sau này chỉ lặp lại đúng những gì bạn vừa làm bằng tay. Nếu làm tay mà tài khoản đã bị hỏi xác minh, thì tự động cũng sẽ như vậy, chỉ nhanh hơn 20 lần.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ stepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d2_3 }}\">\n            <div style=\"{{ circleStyle.d2_3 }}\"><span style=\"{{ checkStyle.d2_3 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d2_3 }}\">Nếu 1–2 tài khoản đó ổn, tạo bảng tài khoản trong Account Manager. <a href=\"https://genfarmer.com/hdsd.pdf#page=10\" target=\"_blank\" style=\"{{ refPillStyle }}\">HDSD tr. 10–11<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ stepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d2_4 }}\">\n            <div style=\"{{ circleStyle.d2_4 }}\"><span style=\"{{ checkStyle.d2_4 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d2_4 }}\">Nhập đủ 5 tài khoản vào bảng. Định dạng mặc định là <span style=\"font-family:'IBM Plex Mono',monospace;color:#2563EB\">UID|Password|2FA<\u002Fspan>, muốn đổi thì vào mục Custom. <a href=\"https://genfarmer.com/hdsd.pdf#page=11\" target=\"_blank\" style=\"{{ refPillStyle }}\">HDSD tr. 11–13<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ stepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d2_5 }}\">\n            <div style=\"{{ circleStyle.d2_5 }}\"><span style=\"{{ checkStyle.d2_5 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d2_5 }}\">Gán thiết bị cho từng tài khoản: sao chép Device ID ở màn hình chính, dán vào cột Device ID. <a href=\"https://genfarmer.com/hdsd.pdf#page=14\" target=\"_blank\" style=\"{{ refPillStyle }}\">HDSD tr. 14–15<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ stepRowLastStyle }}\" sc-camel-on-click=\"{{ toggles.d2_6 }}\">\n            <div style=\"{{ circleStyle.d2_6 }}\"><span style=\"{{ checkStyle.d2_6 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d2_6 }}\">Để yên 48 giờ. Không chạy gì cả. Đây không phải thời gian chết — đây là phép thử.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"{{ gateStyle }}\">\n            <div style=\"{{ gateTitleStyle }}\">XONG KHI<\u002Fdiv>\n            <p style=\"{{ gateTextStyle }}\">5 trên 5 tài khoản vẫn đăng nhập được sau 48 giờ, không tài khoản nào bị hỏi xác minh hay khoá tạm.<\u002Fp>\n            <p style=\"{{ gateFailStyle }}\">Chưa đạt thì tuyệt đối chưa mua thêm tài khoản. Đổi nguồn tài khoản hoặc đổi proxy rồi thử lại từ bước 3. Mua 20 tài khoản khi 5 tài khoản còn chưa sống là cách tốn tiền nhanh nhất.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"{{ trapsWrapStyle }}\">\n            <div style=\"{{ trapsTitleStyle }}\">BA LỖI HAY GẶP<\u002Fdiv>\n            <div style=\"{{ trapRowStyle }}\"><span style=\"{{ trapXStyle }}\">×<\u002Fspan><span style=\"{{ trapTextStyle }}\">Mua 20 tài khoản ngay từ đầu cho đủ bộ, rồi mất cả 20 trong một đêm.<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ trapRowStyle }}\"><span style=\"{{ trapXStyle }}\">×<\u002Fspan><span style=\"{{ trapTextStyle }}\">Dùng chung một proxy cho nhiều tài khoản để tiết kiệm, tài khoản chết theo cụm, rồi kết luận là phần cứng có vấn đề.<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ trapRowLastStyle }}\"><span style=\"{{ trapXStyle }}\">×<\u002Fspan><span style=\"{{ trapTextStyle }}\">Đăng nhập liên tiếp nhiều tài khoản trên cùng một máy trong thời gian ngắn. Không người thật nào làm vậy.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"day3\" style=\"margin-bottom:56px;scroll-margin-top:84px\">\n      <div style=\"{{ sectionHeadStyle }}\">\n        <span style=\"font-size:21px;font-weight:700;color:#0F2545\">Ngày 3 — Tự động sơ khai<\u002Fspan>\n        <span style=\"{{ sectionMetaStyle }}\">A6 · lớp 4<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"{{ dayCardStyle }}\">\n        <div style=\"{{ dayHeadStyle }}\">\n          <span style=\"{{ dayBadgeStyle }}\">NGÀY 3<\u002Fspan>\n          <div>\n            <p style=\"{{ dayQStyle }}\">Máy có tự làm thay tôi được không?<\u002Fp>\n            <p style=\"{{ daySubStyle }}\">Hôm nay bạn không học một tính năng mới. Bạn chỉ giao lại cho máy những việc tay mình đã làm ở hai ngày trước.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"{{ dayBodyStyle }}\">\n          <div style=\"{{ defineBoxStyle }}\">\n            <p style=\"margin:0 0 8px;font-size:14.5px;line-height:1.55;color:#1E3A5F\"><b style=\"font-weight:700;color:#0F2545\">Tự động là gì:<\u002Fb> là chính những thao tác bạn đã bấm bằng tay ở Ngày 1 và Ngày 2, được ghi lại thành kịch bản và chạy đồng thời trên nhiều máy. Không cần viết mã, chỉ cần chọn và bấm.<\u002Fp>\n            <p style=\"margin:0 0 8px;font-size:14.5px;line-height:1.55;color:#1E3A5F\"><b style=\"font-weight:700;color:#0F2545\">Đăng nhập tự động<\u002Fb> — đăng nhập và đăng xuất hàng loạt thay vì gõ tay từng máy.<\u002Fp>\n            <p style=\"margin:0 0 8px;font-size:14.5px;line-height:1.55;color:#1E3A5F\"><b style=\"font-weight:700;color:#0F2545\">Nuôi tài khoản (Trust)<\u002Fb> — máy xem video, lướt, thích, theo dõi như một người thật có sở thích rõ ràng. Mục đích là để nền tảng ghi nhận tài khoản này thuộc về một người có thói quen, không phải một tài khoản mới tinh. Chạy 2–4 tuần.<\u002Fp>\n            <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#1E3A5F\"><b style=\"font-weight:700;color:#0F2545\">Đẩy tương tác (Boost)<\u002Fb> — dồn tương tác vào một bài đăng cụ thể để nền tảng phân phối rộng hơn. Chỉ chạy sau khi đã nuôi đủ. Bật Boost trên tài khoản chưa nuôi là cách mất tài khoản nhanh nhất, và tài khoản đã từng chạy tương tác rác thì rất khó hồi phục.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"{{ flowRowStyle }}\">\n            <div style=\"{{ flowStepStyle }}\">\n              <div style=\"{{ flowIconStyle }}\">⬇<\u002Fdiv>\n              <span style=\"{{ flowLabelStyle }}\">Cài app nền tảng<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"{{ flowArrowStyle }}\">›<\u002Fdiv>\n            <div style=\"{{ flowStepStyle }}\">\n              <div style=\"{{ flowIconStyle }}\">⛁<\u002Fdiv>\n              <span style=\"{{ flowLabelStyle }}\">Tải gói tự động<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"{{ flowArrowStyle }}\">›<\u002Fdiv>\n            <div style=\"{{ flowStepStyle }}\">\n              <div style=\"{{ flowIconStyle }}\">⇄<\u002Fdiv>\n              <span style=\"{{ flowLabelStyle }}\">Chạy Auto Login<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"{{ flowArrowStyle }}\">›<\u002Fdiv>\n            <div style=\"{{ flowStepStyle }}\">\n              <div style=\"{{ flowIconStyle }}\">❋<\u002Fdiv>\n              <span style=\"{{ flowLabelStyle }}\">Bật Trust nuôi tài khoản<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"{{ h4Style }}\">CÁC BƯỚC<\u002Fdiv>\n\n          <div style=\"{{ stepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d3_0 }}\">\n            <div style=\"{{ circleStyle.d3_0 }}\"><span style=\"{{ checkStyle.d3_0 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d3_0 }}\">Cài ứng dụng nền tảng lên các máy: tải file APK, chọn tất cả máy, bấm Install APK. <a href=\"https://genfarmer.com/hdsd.pdf#page=17\" target=\"_blank\" style=\"{{ refPillStyle }}\">HDSD tr. 17 · 51 · 78 · 102 · 124<\u002Fa>\n              <div style=\"{{ subNoteStyle }}\"><b style=\"color:#1E3A5F;font-weight:600\">Lưu ý quan trọng:<\u002Fb> trong HDSD, link tải APK của Facebook, Instagram, X và Spotify đều đang trỏ nhầm sang file của TikTok. Làm đúng theo tài liệu sẽ cài nhầm ứng dụng. Hỏi đội hỗ trợ xin link đúng trước khi cài.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ stepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d3_1 }}\">\n            <div style=\"{{ circleStyle.d3_1 }}\"><span style=\"{{ checkStyle.d3_1 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d3_1 }}\">Vào Store, tìm và tải gói tự động của nền tảng bạn dùng. Có video hướng dẫn kèm theo. <a href=\"https://genfarmer.com/hdsd.pdf#page=18\" target=\"_blank\" style=\"{{ refPillStyle }}\">HDSD tr. 18–20 · 52–55 · 80–83<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ stepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d3_2 }}\">\n            <div style=\"{{ circleStyle.d3_2 }}\"><span style=\"{{ checkStyle.d3_2 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d3_2 }}\">Tải ba công cụ của nền tảng: Auto Login, Trust và Boost. <a href=\"https://genfarmer.com/hdsd.pdf#page=21\" target=\"_blank\" style=\"{{ refPillStyle }}\">HDSD tr. 21–24 · 56–59 · 84–88<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ stepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d3_3 }}\">\n            <div style=\"{{ circleStyle.d3_3 }}\"><span style=\"{{ checkStyle.d3_3 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d3_3 }}\">Mở màn hình Account Manager — đây là nơi bạn chọn tài khoản nào chạy kịch bản nào. Ngày 2 bạn đã dùng màn này để chứa tài khoản; hôm nay bạn dùng nó để ra lệnh.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ stepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d3_4 }}\">\n            <div style=\"{{ circleStyle.d3_4 }}\"><span style=\"{{ checkStyle.d3_4 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d3_4 }}\">Chạy Auto Login trên đúng 5 tài khoản đã có. Chưa mở rộng.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ stepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d3_5 }}\">\n            <div style=\"{{ circleStyle.d3_5 }}\"><span style=\"{{ checkStyle.d3_5 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d3_5 }}\">Bật Trust cho 5 tài khoản đó, để chạy qua đêm.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ stepRowLastStyle }}\" sc-camel-on-click=\"{{ toggles.d3_6 }}\">\n            <div style=\"{{ circleStyle.d3_6 }}\"><span style=\"{{ checkStyle.d3_6 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d3_6 }}\">Sáng hôm sau kiểm tra. Nếu cả 5 còn sống thì mua thêm cho đủ 20, chạy Auto Login và Trust cho toàn bộ 20 máy.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"{{ gateStyle }}\">\n            <div style=\"{{ gateTitleStyle }}\">XONG KHI<\u002Fdiv>\n            <p style=\"{{ gateTextStyle }}\">20 máy tự đăng nhập và tự chạy nuôi tài khoản qua đêm mà bạn không phải can thiệp.<\u002Fp>\n            <p style=\"{{ gateFailStyle }}\">Nếu qua đêm có tài khoản chết, đừng mở rộng. Quay lại kiểm tra proxy và tốc độ chạy trước.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"{{ trapsWrapStyle }}\">\n            <div style=\"{{ trapsTitleStyle }}\">BA LỖI HAY GẶP<\u002Fdiv>\n            <div style=\"{{ trapRowStyle }}\"><span style=\"{{ trapXStyle }}\">×<\u002Fspan><span style=\"{{ trapTextStyle }}\">Bật Boost ngay ngày đầu vì muốn thấy kết quả sớm. Đây là lỗi tốn kém nhất trong toàn bộ lộ trình.<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ trapRowStyle }}\"><span style=\"{{ trapXStyle }}\">×<\u002Fspan><span style=\"{{ trapTextStyle }}\">Chạy hết công suất ngay lần đầu thay vì tăng dần.<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ trapRowLastStyle }}\"><span style=\"{{ trapXStyle }}\">×<\u002Fspan><span style=\"{{ trapTextStyle }}\">Đến phần bình luận tự động mới phát hiện chưa có API key Gemini, phải dừng giữa chừng. Việc này đã nằm trong Ngày 0.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"day45\" style=\"margin-bottom:56px;scroll-margin-top:84px\">\n      <div style=\"{{ sectionHeadStyle }}\">\n        <span style=\"font-size:21px;font-weight:700;color:#0F2545\">Ngày 4–5 — Theo nền tảng của bạn<\u002Fspan>\n        <span style=\"{{ sectionMetaStyle }}\">A7<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"{{ sectionNoteStyle }}\">Từ đây trở đi mỗi người đi một hướng khác nhau. Bạn không cần đọc hết 141 trang — chỉ cần 16 trang phần chung, cộng với đúng chương nền tảng mình đang chạy.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px\">\n        <div style=\"{{ routeCardStyle }}\"><p style=\"font-size:16px;font-weight:700;color:#0F2545;margin:0 0 4px\">TikTok<\u002Fp><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#2563EB;font-weight:600\">tr. 17–50<\u002Fspan><p style=\"font-size:12.5px;color:#5B7A9E;margin:6px 0 0\">34 trang · đầy đủ nhất<\u002Fp><\u002Fdiv>\n        <div style=\"{{ routeCardStyle }}\"><p style=\"font-size:16px;font-weight:700;color:#0F2545;margin:0 0 4px\">Facebook<\u002Fp><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#2563EB;font-weight:600\">tr. 51–77<\u002Fspan><p style=\"font-size:12.5px;color:#5B7A9E;margin:6px 0 0\">27 trang<\u002Fp><\u002Fdiv>\n        <div style=\"{{ routeCardStyle }}\"><p style=\"font-size:16px;font-weight:700;color:#0F2545;margin:0 0 4px\">Instagram<\u002Fp><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#2563EB;font-weight:600\">tr. 78–101<\u002Fspan><p style=\"font-size:12.5px;color:#5B7A9E;margin:6px 0 0\">24 trang<\u002Fp><\u002Fdiv>\n        <div style=\"{{ routeCardStyle }}\"><p style=\"font-size:16px;font-weight:700;color:#0F2545;margin:0 0 4px\">X<\u002Fp><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#2563EB;font-weight:600\">tr. 102–123<\u002Fspan><p style=\"font-size:12.5px;color:#5B7A9E;margin:6px 0 0\">22 trang<\u002Fp><\u002Fdiv>\n        <div style=\"{{ routeCardStyle }}\"><p style=\"font-size:16px;font-weight:700;color:#0F2545;margin:0 0 4px\">Spotify<\u002Fp><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#2563EB;font-weight:600\">tr. 124–134<\u002Fspan><p style=\"font-size:12.5px;color:#5B7A9E;margin:6px 0 0\">11 trang · có phần kiểm tra trước khi chạy<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:#0F2545;padding:13px 16px;border:1px dashed rgba(37,99,235,0.35);border-radius:12px;background:rgba(255,255,255,0.5);backdrop-filter:blur(10px)\">16 trang chung + 1 chương nền tảng ≈ 46 trang cần đọc, không phải 141.<\u002Fdiv>\n\n      <div style=\"{{ dayCardStyle }} margin-top:22px\">\n        <div style=\"{{ dayHeadStyle }}\">\n          <span style=\"{{ dayBadgeStyle }}\">NGÀY 4–5<\u002Fspan>\n          <div>\n            <p style=\"{{ dayQStyle }}\">Nó làm ra được gì cho tôi?<\u002Fp>\n            <p style=\"{{ daySubStyle }}\">Hai ngày này là để thành thục, không phải để học thêm khái niệm mới.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"{{ dayBodyStyle }}\">\n          <div style=\"{{ flowRowStyle }}\">\n            <div style=\"{{ flowStepStyle }}\">\n              <div style=\"{{ flowIconStyle }}\">▤<\u002Fdiv>\n              <span style=\"{{ flowLabelStyle }}\">Đọc chương nền tảng<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"{{ flowArrowStyle }}\">›<\u002Fdiv>\n            <div style=\"{{ flowStepStyle }}\">\n              <div style=\"{{ flowIconStyle }}\">◎<\u002Fdiv>\n              <span style=\"{{ flowLabelStyle }}\">Cấu hình đúng lĩnh vực<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"{{ flowArrowStyle }}\">›<\u002Fdiv>\n            <div style=\"{{ flowStepStyle }}\">\n              <div style=\"{{ flowIconStyle }}\">▶<\u002Fdiv>\n              <span style=\"{{ flowLabelStyle }}\">Chạy thử kịch bản<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"{{ flowArrowStyle }}\">›<\u002Fdiv>\n            <div style=\"{{ flowStepStyle }}\">\n              <div style=\"{{ flowIconStyle }}\">⚠<\u002Fdiv>\n              <span style=\"{{ flowLabelStyle }}\">Nhận biết dấu hiệu cần dừng<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"{{ h4Style }}\">CÁC BƯỚC<\u002Fdiv>\n\n          <div style=\"{{ stepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d4_0 }}\">\n            <div style=\"{{ circleStyle.d4_0 }}\"><span style=\"{{ checkStyle.d4_0 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d4_0 }}\">Đọc chương nền tảng của mình, tập trung vào phần cấu hình.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ stepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d4_1 }}\">\n            <div style=\"{{ circleStyle.d4_1 }}\"><span style=\"{{ checkStyle.d4_1 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d4_1 }}\">Cấu hình theo đúng lĩnh vực nội dung của bạn — chọn sai chủ đề thì tài khoản sẽ được nuôi thành người quan tâm thứ khác, và bài đăng sẽ không tới đúng người.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ stepRowStyle }}\" sc-camel-on-click=\"{{ toggles.d4_2 }}\">\n            <div style=\"{{ circleStyle.d4_2 }}\"><span style=\"{{ checkStyle.d4_2 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d4_2 }}\">Chạy một kịch bản trọn vẹn từ đầu đến cuối, tự mình đọc kết quả.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ stepRowLastStyle }}\" sc-camel-on-click=\"{{ toggles.d4_3 }}\">\n            <div style=\"{{ circleStyle.d4_3 }}\"><span style=\"{{ checkStyle.d4_3 }}\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ textStyle.d4_3 }}\">Học nhận biết ba dấu hiệu cần dừng lại: tài khoản bị hỏi xác minh nhiều hơn bình thường, bài đăng đột ngột mất hẳn lượt xem, hoặc số máy đang chạy giảm dần không rõ lý do.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"{{ gateStyle }}\">\n            <div style=\"{{ gateTitleStyle }}\">XONG KHI<\u002Fdiv>\n            <p style=\"{{ gateTextStyle }}\">Bạn tự cấu hình được một kịch bản mới mà không cần mở lại tài liệu.<\u002Fp>\n            <p style=\"{{ gateFailStyle }}\">Từ đây là giai đoạn nuôi tài khoản, kéo dài 2–4 tuần. Trong thời gian đó số liệu tăng chậm và đó là bình thường. Đừng tăng tốc để bù.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"symptoms\" style=\"margin-bottom:56px;scroll-margin-top:84px\">\n      <div style=\"{{ sectionHeadStyle }}\">\n        <span style=\"font-size:21px;font-weight:700;color:#0F2545\">Tra cứu theo triệu chứng<\u002Fspan>\n        <span style=\"{{ sectionMetaStyle }}\">A7 · mặt sau<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"{{ sectionNoteStyle }}\">Lần đầu bạn đọc tài liệu theo thứ tự. Từ lần thứ hai trở đi bạn sẽ tra theo thứ mình đang nhìn thấy trên màn hình. Bảng này dành cho lần thứ hai.<\u002Fp>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <div style=\"{{ symRowStyle }}\"><span style=\"{{ symTextStyle }}\">Bấm Scan không ra máy nào<\u002Fspan><span style=\"{{ layerPillStyle('#2563EB') }}\">1 · MÁY<\u002Fspan><span style=\"{{ symAnswerStyle }}\">HDSD tr. 4–8 — kiểm tra hai dải địa chỉ và nút Active<\u002Fspan><\u002Fdiv>\n        <div style=\"{{ symRowStyle }}\"><span style=\"{{ symTextStyle }}\">Ra máy nhưng màn hình đen<\u002Fspan><span style=\"{{ layerPillStyle('#2563EB') }}\">1 · MÁY<\u002Fspan><span style=\"{{ symMissStyle }}\">◧ cần bổ sung — liên hệ hỗ trợ<\u002Fspan><\u002Fdiv>\n        <div style=\"{{ symRowStyle }}\"><span style=\"{{ symTextStyle }}\">Máy hiện lên nhưng không vào được mạng<\u002Fspan><span style=\"{{ layerPillStyle('#0891B2') }}\">2 · MẠNG<\u002Fspan><span style=\"{{ symMissStyle }}\">◧ cần bổ sung — kiểm tra proxy và Isolate Mode<\u002Fspan><\u002Fdiv>\n        <div style=\"{{ symRowStyle }}\"><span style=\"{{ symTextStyle }}\">Nhiều tài khoản chết cùng một lúc<\u002Fspan><span style=\"{{ layerPillStyle('#0891B2') }}\">2 · MẠNG<\u002Fspan><span style=\"{{ symMissStyle }}\">◧ cần bổ sung — nhiều tài khoản đang dùng chung một địa chỉ<\u002Fspan><\u002Fdiv>\n        <div style=\"{{ symRowStyle }}\"><span style=\"{{ symTextStyle }}\">Đăng nhập được rồi bị hỏi xác minh<\u002Fspan><span style=\"{{ layerPillStyle('#7C3AED') }}\">3 · DANH TÍNH<\u002Fspan><span style=\"{{ symMissStyle }}\">◧ cần bổ sung — xem lại Ngày 2 ở trang A5<\u002Fspan><\u002Fdiv>\n        <div style=\"{{ symRowStyle }}\"><span style=\"{{ symTextStyle }}\">Tài khoản còn sống nhưng bài đăng không ai thấy<\u002Fspan><span style=\"{{ layerPillStyle('#7C3AED') }}\">3 · DANH TÍNH<\u002Fspan><span style=\"{{ symMissStyle }}\">◧ cần bổ sung — thường do nuôi chưa đủ hoặc sai chủ đề<\u002Fspan><\u002Fdiv>\n        <div style=\"{{ symRowStyle }}\"><span style=\"{{ symTextStyle }}\">Mọi thứ chạy nhưng số liệu không tăng<\u002Fspan><span style=\"{{ layerPillStyle('#059669') }}\">4 · KỊCH BẢN<\u002Fspan><span style=\"{{ symAnswerStyle }}\">Chương nền tảng — phần cấu hình<\u002Fspan><\u002Fdiv>\n        <div style=\"{{ symRowStyle }}\"><span style=\"{{ symTextStyle }}\">Cài xong lại ra nhầm ứng dụng khác<\u002Fspan><span style=\"{{ layerPillStyle('#059669') }}\">4 · KỊCH BẢN<\u002Fspan><span style=\"{{ symAnswerStyle }}\">Link APK trong HDSD đang sai — xin link đúng từ hỗ trợ<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"gaps\" style=\"margin-bottom:40px;scroll-margin-top:84px\">\n      <div style=\"{{ sectionHeadStyle }}\">\n        <span style=\"font-size:21px;font-weight:700;color:#0F2545\">Danh sách chỗ cần bổ sung<\u002Fspan>\n        <span style=\"{{ sectionMetaStyle }}\">nội bộ · 10 mục<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"{{ sectionNoteStyle }}\">Gom lại toàn bộ chỗ đánh dấu <span style=\"{{ missingPillStyle }}\">◧ cần bổ sung<\u002Fspan> ở các trang trên, để tiện giao việc. Xếp theo mức độ khách hay gặp, không theo thứ tự trang.<\u002Fp>\n\n      <div style=\"border:1px solid rgba(217,119,6,0.35);border-left-width:4px;background:rgba(255,251,235,0.65);backdrop-filter:blur(14px);border-radius:0 18px 18px 0;padding:22px 24px;box-shadow:0 8px 28px rgba(217,119,6,0.08)\">\n        <div style=\"display:flex;align-items:baseline;gap:12px;margin:0 0 4px;flex-wrap:wrap\">\n          <span style=\"font-size:17px;font-weight:700;color:#92400E\">Chưa có nội dung — chờ bổ sung<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#92400E\">10 mục · 5 thuộc phần A · 5 thuộc HDSD<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-size:13.5px;color:#7C5A1E;margin:0 0 18px;max-width:66ch\">Sáu trong mười mục nằm ở lớp mạng và lớp danh tính. Đây cũng chính là hai lớp làm khách chết tài khoản nhiều nhất, nên nếu chỉ làm được vài mục thì nên bắt đầu từ nhóm đó.<\u002Fp>\n\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"{{ gapRowStyle }}\"><span style=\"{{ gapTextStyle }}\">Gán proxy cho từng máy qua GenRouter, bật Isolate Mode<\u002Fspan><span style=\"{{ layerPillStyle('#0891B2') }}\">2 · MẠNG<\u002Fspan><span style=\"{{ gapWhereStyle }}\">A5 · bước 2<\u002Fspan><span style=\"{{ gapNoteStyle }}\">Quan trọng nhất. Cả 141 trang không có một dòng nào về proxy.<\u002Fspan><\u002Fdiv>\n          <div style=\"{{ gapRowStyle }}\"><span style=\"{{ gapTextStyle }}\">Nhiều tài khoản chết cùng lúc — cách kiểm tra và xử lý<\u002Fspan><span style=\"{{ layerPillStyle('#0891B2') }}\">2 · MẠNG<\u002Fspan><span style=\"{{ gapWhereStyle }}\">bảng triệu chứng<\u002Fspan><span style=\"{{ gapNoteStyle }}\">Nguyên nhân gần như luôn là dùng chung địa chỉ.<\u002Fspan><\u002Fdiv>\n          <div style=\"{{ gapRowStyle }}\"><span style=\"{{ gapTextStyle }}\">Máy hiện lên nhưng không vào được mạng<\u002Fspan><span style=\"{{ layerPillStyle('#0891B2') }}\">2 · MẠNG<\u002Fspan><span style=\"{{ gapWhereStyle }}\">bảng triệu chứng<\u002Fspan><span style=\"{{ gapNoteStyle }}\"><\u002Fspan><\u002Fdiv>\n          <div style=\"{{ gapRowStyle }}\"><span style=\"{{ gapTextStyle }}\">Đăng nhập được rồi bị hỏi xác minh — làm gì tiếp<\u002Fspan><span style=\"{{ layerPillStyle('#7C3AED') }}\">3 · DANH TÍNH<\u002Fspan><span style=\"{{ gapWhereStyle }}\">bảng triệu chứng<\u002Fspan><span style=\"{{ gapNoteStyle }}\">Câu hỏi hỗ trợ nhiều nhất trong tuần đầu.<\u002Fspan><\u002Fdiv>\n          <div style=\"{{ gapRowStyle }}\"><span style=\"{{ gapTextStyle }}\">Tài khoản còn sống nhưng bài đăng không ai thấy<\u002Fspan><span style=\"{{ layerPillStyle('#7C3AED') }}\">3 · DANH TÍNH<\u002Fspan><span style=\"{{ gapWhereStyle }}\">bảng triệu chứng<\u002Fspan><span style=\"{{ gapNoteStyle }}\">Thường do nuôi chưa đủ hoặc sai chủ đề.<\u002Fspan><\u002Fdiv>\n          <div style=\"{{ gapRowStyle }}\"><span style=\"{{ gapTextStyle }}\">Bắt wifi tự động cho cả 20 máy<\u002Fspan><span style=\"{{ layerPillStyle('#2563EB') }}\">1 · MÁY<\u002Fspan><span style=\"{{ gapWhereStyle }}\">A4 · bước 4<\u002Fspan><span style=\"{{ gapNoteStyle }}\">Cần chụp màn hình thật, xác nhận đúng tên nút.<\u002Fspan><\u002Fdiv>\n          <div style=\"{{ gapRowStyle }}\"><span style=\"{{ gapTextStyle }}\">Đổi thời gian hệ thống trên máy<\u002Fspan><span style=\"{{ layerPillStyle('#2563EB') }}\">1 · MÁY<\u002Fspan><span style=\"{{ gapWhereStyle }}\">A4 · bước 5<\u002Fspan><span style=\"{{ gapNoteStyle }}\"><\u002Fspan><\u002Fdiv>\n          <div style=\"{{ gapRowStyle }}\"><span style=\"{{ gapTextStyle }}\">Bật tắt đèn pin để kiểm tra máy có nhận lệnh<\u002Fspan><span style=\"{{ layerPillStyle('#2563EB') }}\">1 · MÁY<\u002Fspan><span style=\"{{ gapWhereStyle }}\">A4 · bước 6<\u002Fspan><span style=\"{{ gapNoteStyle }}\">Ngắn thôi, nhưng là phép thử đầu tiên khách làm được.<\u002Fspan><\u002Fdiv>\n          <div style=\"{{ gapRowStyle }}\"><span style=\"{{ gapTextStyle }}\">Đồng bộ thao tác trên nhiều máy cùng lúc<\u002Fspan><span style=\"{{ layerPillStyle('#2563EB') }}\">1 · MÁY<\u002Fspan><span style=\"{{ gapWhereStyle }}\">A4 · bước 7<\u002Fspan><span style=\"{{ gapNoteStyle }}\"><\u002Fspan><\u002Fdiv>\n          <div style=\"{{ gapRowStyle }}\"><span style=\"{{ gapTextStyle }}\">Ra máy nhưng màn hình đen<\u002Fspan><span style=\"{{ layerPillStyle('#2563EB') }}\">1 · MÁY<\u002Fspan><span style=\"{{ gapWhereStyle }}\">bảng triệu chứng<\u002Fspan><span style=\"{{ gapNoteStyle }}\"><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"border-top:1px solid rgba(30,58,95,0.15);margin-top:50px;padding-top:20px;font-size:13px;color:#5B7A9E;line-height:1.65\">\n      <b style=\"color:#0F2545;font-weight:600\">Phần A · bản 1.0 · cập nhật 09/2026<\u002Fb><br>\n      Đi kèm HDSD GenFarmer 141 trang. Phần A đánh số riêng (A1–A7) nên số trang của HDSD giữ nguyên, không bị lệch.<br>\n      Những ô đánh dấu <b style=\"color:#0F2545;font-weight:600\">cần bổ sung<\u002Fb> (nền vàng) là phần đang chờ viết thêm — xem danh sách gom lại ở cuối tài liệu. Khi gặp các trường hợp đó, liên hệ đội hỗ trợ kèm theo: đang dùng mấy box, kết nối bằng USB hay OTG, và đang ở ngày thứ mấy của lộ trình.\n    <\u002Fp>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst STEP_IDS = [\n  'd0_0','d0_1','d0_2','d0_3','d0_4','d0_5','d0_6',\n  'd1_0','d1_1','d1_2','d1_3','d1_3a','d1_3b','d1_3c','d1_3d','d1_3e','d1_3f',\n  'd2_0','d2_1','d2_2','d2_3','d2_4','d2_5','d2_6',\n  'd3_0','d3_1','d3_2','d3_3','d3_4','d3_5','d3_6',\n  'd4_0','d4_1','d4_2','d4_3'\n];\n\nclass Component extends DCLogic {\n  state = { checked: {}, navOpen: false };\n\n  toggleStep(id) {\n    this.setState(s => ({ checked: { ...s.checked, [id]: !s.checked[id] } }));\n  }\n\n  renderVals() {\n    const checked = this.state.checked;\n    const doneCount = STEP_IDS.filter(id => checked[id]).length;\n    const totalSteps = STEP_IDS.length;\n    const percent = Math.round((doneCount / totalSteps) * 100);\n\n    const toggles = {};\n    const circleStyle = {};\n    const checkStyle = {};\n    const textStyle = {};\n    const circleStyleSub = {};\n    const checkStyleSub = {};\n    const textStyleSub = {};\n    STEP_IDS.forEach(id => {\n      const on = !!checked[id];\n      const sub = id.length > 4;\n      toggles[id] = () => this.toggleStep(id);\n      const cStyle = {\n        width: sub ? 18 : 22, height: sub ? 18 : 22, borderRadius: sub ? 6 : 7, flexShrink: 0, marginTop: 1,\n        display: 'flex', alignItems: 'center', justifyContent: 'center',\n        border: on ? 'none' : '1.5px solid rgba(37,99,235,0.4)',\n        background: on ? 'linear-gradient(135deg,#3B82F6,#2563EB)' : 'rgba(255,255,255,0.5)',\n        boxShadow: on ? '0 2px 8px rgba(37,99,235,0.35)' : 'none',\n        transition: 'all .15s ease', cursor: 'pointer'\n      };\n      const chkStyle = { color: '#fff', fontSize: sub ? 10 : 12, fontWeight: 700, opacity: on ? 1 : 0, transition: 'opacity .1s' };\n      const txtStyle = { fontSize: sub ? 13.5 : 14.5, lineHeight: 1.55, color: on ? '#7C93AB' : '#33475F', textDecoration: on ? 'line-through' : 'none', transition: 'color .15s', cursor: 'default' };\n      if (sub) { circleStyleSub[id] = cStyle; checkStyleSub[id] = chkStyle; textStyleSub[id] = txtStyle; }\n      else { circleStyle[id] = cStyle; checkStyle[id] = chkStyle; textStyle[id] = txtStyle; }\n    });\n\n    const navOpen = this.state.navOpen;\n\n    return {\n      checked, toggles, circleStyle, checkStyle, textStyle, circleStyleSub, checkStyleSub, textStyleSub,\n      doneCount, totalSteps, progressPercent: percent,\n      toggleNav: () => this.setState(s => ({ navOpen: !s.navOpen })),\n      closeNav: () => this.setState({ navOpen: false }),\n\n      progressBarFillStyle: { width: percent + '%', height: '100%', borderRadius: 6, background: 'linear-gradient(90deg,#3B82F6,#22D3EE)', transition: 'width .3s ease' },\n\n      topbarStyle: { position: 'fixed', top: 0, left: 0, right: 0, height: 64, zIndex: 20, display: 'flex', alignItems: 'center', gap: 14, padding: '0 20px', background: 'rgba(255,255,255,0.55)', backdropFilter: 'blur(20px)', borderBottom: '1px solid rgba(255,255,255,0.6)' },\n\n      overlayStyle: { position: 'fixed', inset: 0, zIndex: 25, background: 'rgba(15,37,69,0.35)', backdropFilter: 'blur(2px)', opacity: navOpen ? 1 : 0, pointerEvents: navOpen ? 'auto' : 'none', transition: 'opacity .2s ease' },\n\n      sidebarStyle: { position: 'fixed', top: 0, left: 0, bottom: 0, width: 290, zIndex: 30, background: 'rgba(255,255,255,0.75)', backdropFilter: 'blur(24px)', borderRight: '1px solid rgba(255,255,255,0.7)', boxShadow: '8px 0 40px rgba(31,71,140,0.12)', display: 'flex', flexDirection: 'column', overflowY: 'auto', transform: navOpen ? 'translateX(0)' : 'translateX(-100%)', transition: 'transform .25s ease' },\n\n      navLinkStyle: { display: 'block', padding: '9px 12px', borderRadius: 10, fontSize: 13.5, color: '#33475F', textDecoration: 'none' },\n\n      sectionHeadStyle: { display: 'flex', alignItems: 'baseline', gap: 14, padding: '0 0 14px', borderBottom: '2px solid rgba(15,37,69,0.85)', flexWrap: 'wrap', marginBottom: 4 },\n      sectionMetaStyle: { fontFamily: \"'IBM Plex Mono',monospace\", fontSize: 12.5, color: '#5B7A9E', marginLeft: 'auto' },\n      sectionNoteStyle: { fontSize: 13.5, color: '#4B6584', margin: '12px 0 22px', maxWidth: '66ch' },\n\n      glassCardStyle: { background: 'rgba(255,255,255,0.55)', backdropFilter: 'blur(18px)', border: '1px solid rgba(255,255,255,0.7)', borderRadius: 18, padding: '18px 18px', boxShadow: '0 8px 28px rgba(31,71,140,0.1)' },\n\n      dayCardStyle: { background: 'rgba(255,255,255,0.5) 4),rgba(34,211,238,0.1))', border: '1px solid rgba(37,99,235,0.25)', boxShadow: '0 4px 12px rgba(37,99,235,0.12)' },\n      flowLabelStyle: { fontSize: 12.5, fontWeight: 600, color: '#1E3A5F', textAlign: 'center', lineHeight: 1.4 },\n      flowArrowStyle: { fontSize: 16, color: '#B9C7DA', flexShrink: 0, alignSelf: 'center', marginTop: 26, padding: '0 4px' },\n\n      stepRowStyle: { display: 'flex', gap: 13, padding: '11px 10px', borderRadius: 12, transition: 'background .15s' },\n      stepRowLastStyle: { display: 'flex', gap: 13, padding: '11px 10px', borderRadius: 12 },\n      subStepRowStyle: { display: 'flex', gap: 11, padding: '8px 10px 8px 34px', borderRadius: 10, borderLeft: '2px solid rgba(37,99,235,0.2)', marginLeft: 10 },\n      subStepRowLastStyle: { display: 'flex', gap: 11, padding: '8px 10px 8px 34px', borderRadius: 10, borderLeft: '2px solid rgba(37,99,235,0.2)', marginLeft: 10, marginBottom: 4 },\n      subNoteStyle: { fontSize: 13, color: '#5B7A9E', marginTop: 6, lineHeight: 1.5 },\n\n      refPillStyle: { display: 'inline-block', fontFamily: \"'IBM Plex Mono',monospace\", fontSize: 11.5, color: '#2563EB', border: '1px solid rgba(37,99,235,0.3)', borderRadius: 6, padding: '1px 7px', marginLeft: 5, whiteSpace: 'nowrap', background: 'rgba(37,99,235,0.06)' },\n      missingPillStyle: { display: 'inline-block', fontFamily: \"'IBM Plex Mono',monospace\", fontSize: 11.5, color: '#92400E', border: '1px solid rgba(217,119,6,0.4)', borderRadius: 6, padding: '1px 7px', marginLeft: 5, whiteSpace: 'nowrap', background: 'rgba(253,230,138,0.35)', fontWeight: 600 },\n\n      gateStyle: { border: '1px solid rgba(16,185,129,0.4)', borderLeftWidth: 3, borderRadius: '0 14px 14px 0', padding: '15px 18px', marginTop: 26, background: 'rgba(236,253,245,0.6)', backdropFilter: 'blur(8px)' },\n      gateTitleStyle: { fontFamily: \"'IBM Plex Mono',monospace\", fontSize: 11.5, color: '#059669', margin: '0 0 6px', fontWeight: 700 },\n      gateTextStyle: { margin: 0, fontSize:
